version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    The prescribed higher Specht quotient classes with alternative
    dominance-triangular multipliers give the simultaneous basis for
    every finite expression of Griffin ideal sums and intersections.
    Only multipliers at eligible indices must satisfy triangularity.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
