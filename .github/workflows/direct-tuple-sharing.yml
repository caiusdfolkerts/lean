name: Small nonrational direct-literal shared tuple control

on:
  push:
    branches: [palomar/diagnostic-small-nonrational-direct-tuple-sharing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Check direct-literal data and shared tuple proofs on the exact 18-key graph block
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: overlay
      - name: Fetch the exact pure-geometry baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b9a6e46ce4315da1d14079ca153335d3ec5ccde
          persist-credentials: false
          path: baseline
      - name: Generate concrete sharing proofs from verified baseline data
        run: python3 overlay/prepare_control.py baseline
      - name: Check generated source closure
        working-directory: baseline
        run: python3 diagnostic/run.py replacement
      - name: Save the source snapshot manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-tuple-sharing-source-${{ github.sha }}
          path: baseline/diagnostic/manifest.json
          if-no-files-found: error
          retention-days: 5
      - name: Install pinned Lean
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/block0528-elan"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 --output "$RUNNER_TEMP/block0528-elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/block0528-elan.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/block0528-elan.tar.gz" -C "$RUNNER_TEMP/block0528-elan"
          "$RUNNER_TEMP/block0528-elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and measure generic and decoded graph exports
        timeout-minutes: 115
        working-directory: baseline
        run: python3 diagnostic/run.py replacement --run
      - name: Save exports receipt
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-tuple-sharing-exports-${{ github.sha }}
          path: baseline/diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
      - name: Replay joint export with lean_kernel
        id: lean_kernel
        working-directory: baseline
        run: python3 diagnostic/replay.py lean_kernel
      - name: Save lean_kernel receipt
        if: always() && !cancelled() && steps.lean_kernel.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-tuple-sharing-lean_kernel-${{ github.sha }}
          path: baseline/diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
      - name: Replay joint export with nanoda
        id: nanoda
        working-directory: baseline
        run: python3 diagnostic/replay.py nanoda
      - name: Save nanoda receipt
        if: always() && !cancelled() && steps.nanoda.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-tuple-sharing-nanoda-${{ github.sha }}
          path: baseline/diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
      - name: Replay joint export with con_ron
        id: con_ron
        working-directory: baseline
        run: python3 diagnostic/replay.py con_ron
      - name: Save con_ron receipt
        if: always() && !cancelled() && steps.con_ron.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-tuple-sharing-con_ron-${{ github.sha }}
          path: baseline/diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
