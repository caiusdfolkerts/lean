name: Small nonrational residual-family diagnostic

on:
  push:
    branches: [palomar/diagnostic-small-nonrational-family]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Measure three graph blocks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/block0528-elan"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 --output "$RUNNER_TEMP/block0528-elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/block0528-elan.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/block0528-elan.tar.gz" -C "$RUNNER_TEMP/block0528-elan"
          "$RUNNER_TEMP/block0528-elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and measure generic, separate and joint exports
        timeout-minutes: 115
        run: python3 diagnostic/run.py replacement --run
      - name: Save exports receipt
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graph-family-exports-${{ github.sha }}
          path: diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
      - name: Replay joint export with lean_kernel
        id: lean_kernel
        run: python3 diagnostic/replay.py lean_kernel
      - name: Save lean_kernel receipt
        if: always() && !cancelled() && steps.lean_kernel.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graph-family-lean_kernel-${{ github.sha }}
          path: diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
      - name: Replay joint export with nanoda
        id: nanoda
        run: python3 diagnostic/replay.py nanoda
      - name: Save nanoda receipt
        if: always() && !cancelled() && steps.nanoda.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graph-family-nanoda-${{ github.sha }}
          path: diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
      - name: Replay joint export with con_ron
        id: con_ron
        run: python3 diagnostic/replay.py con_ron
      - name: Save con_ron receipt
        if: always() && !cancelled() && steps.con_ron.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graph-family-con_ron-${{ github.sha }}
          path: diagnostic-results/replacement.json
          retention-days: 5
          if-no-files-found: warn
