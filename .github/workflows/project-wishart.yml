name: Lean wishart

on:
  push:
    paths:
      - 'wishart/**'
      - '!wishart/**/*.md'
      - '!wishart/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-wishart.yml'
  pull_request:
    paths:
      - 'wishart/**'
      - '!wishart/**/*.md'
      - '!wishart/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-wishart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: wishart
