name: Rooted forest bulk diagnostic

on:
  push:
    branches: [palomar/diagnostic-rooted-bulk-r2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify packaged source closure
        run: python3 run.py
      - name: Install pinned Lean
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rooted-elan"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 --output "$RUNNER_TEMP/rooted-elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/rooted-elan.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/rooted-elan.tar.gz" -C "$RUNNER_TEMP/rooted-elan"
          "$RUNNER_TEMP/rooted-elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compare ordinary kernel builds and export both endpoints
        id: build
        timeout-minutes: 70
        run: python3 run.py --phase build
      - name: Save comparison receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rooted-bulk-compilation
          path: results.json
          if-no-files-found: warn
          retention-days: 5
      - name: Lean kernel replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 92
        run: python3 run.py --phase lean_kernel
      - name: NanoDa replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 92
        run: python3 run.py --phase nanoda
      - name: Verified con-ron replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 92
        run: python3 run.py --phase con_ron
      - name: Save verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rooted-bulk-verification
          path: results.json
          if-no-files-found: warn
          retention-days: 5
