name: Lean unimodular

on:
  push:
    paths:
      - 'unimodular/**'
      - '!unimodular/**/*.md'
      - '!unimodular/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-unimodular.yml'
  pull_request:
    paths:
      - 'unimodular/**'
      - '!unimodular/**/*.md'
      - '!unimodular/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-unimodular.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: unimodular
