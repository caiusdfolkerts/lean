name: Canonical Challenge-only diagnostic
run-name: Challenge-only diagnostic ${{ github.run_id }}
# Separate diagnostic only. No full project/Solution build, Comparator or intake.
on:
  push:
    branches: [palomar/diagnostic-singular-measured-parents-20261119]
  workflow_dispatch:
    inputs:
      cases:
        description: Optional comma-separated case IDs; blank runs the revision18 frozen cases
        default: ""
        type: string
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.select.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate immutable inputs and select cases
        id: select
        env:
          DIAGNOSTIC_CASE_FILTER: ${{ inputs.cases || '' }}
        run: python3 reports/challenge_only_diagnostic/run_challenge_diagnostic.py list
  check:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(needs.select.outputs.cases) }}
    env:
      DIAG_CASE: ${{ matrix.case }}
    steps:
      - name: Checkout frozen diagnostic bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect exact input snapshot
        id: inspect
        run: python3 reports/challenge_only_diagnostic/run_challenge_diagnostic.py inspect --case "$DIAG_CASE"
      - name: Checkout pinned canonical-policy helpers
        id: pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
          path: pipeline
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - name: Install pinned Python parsing dependency
        id: dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - name: Free ephemeral runner disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Install pinned elan
        id: elan
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the exact submitted Lean toolchain
        id: toolchain
        env:
          DIAG_TOOLCHAIN: ${{ steps.inspect.outputs.lean_toolchain }}
        run: elan toolchain install "$DIAG_TOOLCHAIN"
      - name: Elaborate only the independent Challenge
        id: diagnostic
        run: |
          python3 reports/challenge_only_diagnostic/run_challenge_diagnostic.py run \
            --case "$DIAG_CASE" \
            --pipeline "$GITHUB_WORKSPACE/pipeline" \
            --work "$RUNNER_TEMP/challenge-work" \
            --output "$RUNNER_TEMP/challenge-evidence" \
            --memory-mib 8192 --setup-timeout 2400 --compile-timeout 2400
      - name: Record incomplete attempts honestly
        if: always()
        env:
          DIAGNOSTIC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 reports/challenge_only_diagnostic/finalize_receipt.py \
            --cases reports/challenge_only_diagnostic/cases.json \
            --case "$DIAG_CASE" --output "$RUNNER_TEMP/challenge-evidence"
      - name: Upload bounded diagnostic receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: challenge-only-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/challenge-evidence/receipt.json
            ${{ runner.temp }}/challenge-evidence/bounded.log
          if-no-files-found: warn
          retention-days: 30
