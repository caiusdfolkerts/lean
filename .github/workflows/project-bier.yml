name: Lean bier

on:
  push:
    paths:
      - 'bier/**'
      - '!bier/**/*.md'
      - '!bier/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-bier.yml'
  pull_request:
    paths:
      - 'bier/**'
      - '!bier/**/*.md'
      - '!bier/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-bier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: bier
