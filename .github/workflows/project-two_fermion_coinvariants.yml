name: Lean two_fermion_coinvariants

on:
  push:
    paths:
      - 'two_fermion_coinvariants/**'
      - '!two_fermion_coinvariants/**/*.md'
      - '!two_fermion_coinvariants/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-two_fermion_coinvariants.yml'
  pull_request:
    paths:
      - 'two_fermion_coinvariants/**'
      - '!two_fermion_coinvariants/**/*.md'
      - '!two_fermion_coinvariants/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-two_fermion_coinvariants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: two_fermion_coinvariants
