name: Read-only exact snapshot comparison diagnostic
run-name: Raw metadata diagnostic cor53raw0001
# Independent diagnostic only. This does not invoke the official reusable
# workflow and does not certify a preflight pass. The verifier CLI itself is
# pinned and unmodified; its retained exports are read in the same remote job.
on:
  push:
    branches: ["palomar-diagnostics/sublattice_resolutions_cor53-cor53raw0001"]

jobs:
  profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.resolve.outputs.labels }}
      timeout: ${{ steps.resolve.outputs.timeout }}
      budget: ${{ steps.resolve.outputs.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
          persist-credentials: false
      - name: Resolve approved execution profile
        id: resolve
        env:
          PALOMAR_EXECUTION_PROFILE: palomar-standard-v1
        run: python3 scripts/verification_profile.py --resolve
  verify:
    needs: profile
    runs-on: ${{ fromJSON(needs.profile.outputs.labels) }}
    env:
      PALOMAR_EXECUTION_PROFILE: palomar-standard-v1
    timeout-minutes: ${{ fromJSON(needs.profile.outputs.timeout) }}
    permissions:
      contents: read
    # Dispatches queue per admitted request; admission concurrency belongs to
    # the submission server. Reusable callers choose their own request ids,
    # so scope their groups to the caller run and attempt as well. Independent
    # CI runs must not cancel each other while pending behind a slow job.
    concurrency:
      group: raw-metadata-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Record verification deadline origin
        run: echo "PALOMAR_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate pinned pipeline revision
        env:
          PIPELINE_COMMIT: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
        run: |
          if [[ ! "$PIPELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "pipeline_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout these diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic-tools
          persist-credentials: false

      - name: Checkout submission pipeline
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
          path: pipeline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.11.10"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        id: ruby
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
          working-directory: pipeline

      - name: Install verifier dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Parse and fetch immutable source
        id: prepare
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/pipeline/Gemfile
          PALOMAR_INPUTS: '{"repository": "caiusdfolkerts/research", "commit": "b57db54002835f75a1ef213af534e48d3c538e36", "request_id": "cor53raw0001", "mode": "full", "options": "{\"project_path\": \"sublattice_resolutions_cor53\", \"comparator_config_path\": \"sublattice_resolutions_cor53/comparator.json\", \"authorization_relationship\": \"I am a responsible author or maintainer\"}", "execution_profile": "palomar-standard-v1", "execution_attempt": ""}'
        run: |
          python - <<'PYTHON'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "submission-inputs.json")
          path.write_text(json.dumps({"inputs": json.loads(os.environ["PALOMAR_INPUTS"])}))
          PYTHON
          python pipeline/scripts/verify_submission.py prepare \
            --event "$RUNNER_TEMP/submission-inputs.json" \
            --work-dir "$RUNNER_TEMP/palomar" \
            --output "$RUNNER_TEMP/mechanical-report.json" \
            --licensee "$(command -v bundle)"

      - name: Free disk space
        id: disk
        if: true && steps.prepare.outputs.ready == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Check palomar-standard-v1 runner capacity
        id: capacity
        if: true && steps.prepare.outputs.ready == 'true'
        run: >-
          python pipeline/scripts/verify_submission.py check-capacity
          --disk-path "$RUNNER_TEMP" --output "$RUNNER_TEMP/mechanical-report.json"

      - name: Install pinned elan
        id: elan
        if: true && steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The submitted toolchain judges the submission: its `lake comparator`,
      # `leanexport`, `leanchecker` and bundled kernels. Nothing else is built.
      - name: Install the submitted Lean toolchain
        id: toolchain
        if: true && steps.prepare.outputs.ready == 'true'
        env:
          SUBMISSION_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: elan toolchain install "$SUBMISSION_TOOLCHAIN"

      - name: Compile exact diagnostic helper before project build
        id: helpercheck
        if: true && steps.prepare.outputs.ready == 'true'
        env:
          SUBMISSION_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: |
          python3 diagnostic-tools/reports/raw_value_diagnostic/validate_helper.py             --toolchain "$SUBMISSION_TOOLCHAIN"             --helper "$GITHUB_WORKSPACE/diagnostic-tools/reports/raw_value_diagnostic/AuditExportsFirstDifferences.lean"             --output "$RUNNER_TEMP/raw-helper-validation"

      - name: Build pinned bubblewrap
        id: bwrap
        if: true && steps.prepare.outputs.ready == 'true' && steps.helpercheck.outcome == 'success'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"

      - name: Run unmodified verifier then read-only raw metadata diagnostic
        id: execute
        if: true && steps.prepare.outputs.ready == 'true' && steps.helpercheck.outcome == 'success'
        run: |
          python3 diagnostic-tools/reports/raw_value_diagnostic/audit_retained_exports.py \
            --pipeline-root "$GITHUB_WORKSPACE/pipeline" \
            --work-dir "$RUNNER_TEMP/palomar" \
            --report "$RUNNER_TEMP/mechanical-report.json" \
            --output-dir "$RUNNER_TEMP/raw-metadata-diagnostic" \
            --audit-lean "$GITHUB_WORKSPACE/diagnostic-tools/reports/raw_value_diagnostic/AuditExportsFirstDifferences.lean" \
            --execute --bwrap "$PALOMAR_BWRAP" \
            --execution-budget-seconds 19800 \
            --max-export-bytes 1342177280 --memory-mib 4096 --timeout-seconds 300 \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Finalize interrupted mechanical report
        id: finalize
        if: always()
        env:
          PALOMAR_INPUTS: '{"repository": "caiusdfolkerts/research", "commit": "b57db54002835f75a1ef213af534e48d3c538e36", "request_id": "cor53raw0001", "mode": "full", "options": "{\"project_path\": \"sublattice_resolutions_cor53\", \"comparator_config_path\": \"sublattice_resolutions_cor53/comparator.json\", \"authorization_relationship\": \"I am a responsible author or maintainer\"}", "execution_profile": "palomar-standard-v1", "execution_attempt": ""}'
          PALOMAR_STEPS: ${{ toJSON(steps) }}
          PALOMAR_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 pipeline/scripts/workflow_report.py finalize --report "$RUNNER_TEMP/mechanical-report.json"

      - name: Upload bounded diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: raw-metadata-diagnostic-cor53raw0001
          path: |
            ${{ runner.temp }}/raw-helper-validation/helper-check.json
            ${{ runner.temp }}/raw-helper-validation/helper-check-bounded.log
            ${{ runner.temp }}/raw-metadata-diagnostic/audit-receipt.json
            ${{ runner.temp }}/raw-metadata-diagnostic/audit-bounded.log
            ${{ runner.temp }}/raw-metadata-diagnostic/mechanical-report-at-audit.json
            ${{ runner.temp }}/mechanical-report.json
          if-no-files-found: warn
          retention-days: 30
