name: Lean volume_polynomials

on:
  push:
    paths:
      - 'volume_polynomials/**'
      - '!volume_polynomials/**/*.md'
      - '!volume_polynomials/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-volume_polynomials.yml'
  pull_request:
    paths:
      - 'volume_polynomials/**'
      - '!volume_polynomials/**/*.md'
      - '!volume_polynomials/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-volume_polynomials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: volume_polynomials
