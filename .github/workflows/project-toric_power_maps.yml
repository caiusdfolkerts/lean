name: Lean toric_power_maps

on:
  push:
    paths:
      - 'toric_power_maps/**'
      - '!toric_power_maps/**/*.md'
      - '!toric_power_maps/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-toric_power_maps.yml'
  pull_request:
    paths:
      - 'toric_power_maps/**'
      - '!toric_power_maps/**/*.md'
      - '!toric_power_maps/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-toric_power_maps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: toric_power_maps
