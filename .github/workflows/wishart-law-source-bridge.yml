name: Independent Wishart law source bridge diagnostic
run-name: Wishart law source bridge diagnostic ${{ github.run_id }}
# Separate bounded diagnostic, never official full preflight or intake.
on:
  push:
    branches: [palomar-diagnostics/wishart-law-source-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout frozen diagnostic bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect exact input snapshot
        id: inspect
        run: python3 diagnostic/run.py inspect
      - name: Checkout pinned canonical-policy helpers
        id: pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
          path: pipeline
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - name: Install pinned Python parsing dependency
        id: dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - name: Free ephemeral runner disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Install pinned elan
        id: elan
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the exact submitted Lean toolchain
        id: toolchain
        env:
          DIAG_TOOLCHAIN: ${{ steps.inspect.outputs.lean_toolchain }}
        run: elan toolchain install "$DIAG_TOOLCHAIN"
      - name: Independently compile laws then exact source equality bridge
        id: diagnostic
        run: |
          python3 diagnostic/run.py run \
            --pipeline "$GITHUB_WORKSPACE/pipeline" \
            --work "$RUNNER_TEMP/wishart-law-work" \
            --output "$RUNNER_TEMP/wishart-law-evidence"
      - name: Record incomplete attempts honestly
        if: always()
        env:
          DIAGNOSTIC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 diagnostic/run.py finalize --output "$RUNNER_TEMP/wishart-law-evidence"
      - name: Upload bounded diagnostic receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wishart-law-two-stage
          path: |
            ${{ runner.temp }}/wishart-law-evidence/receipt.json
            ${{ runner.temp }}/wishart-law-evidence/canonical/receipt.json
            ${{ runner.temp }}/wishart-law-evidence/source/receipt.json
            ${{ runner.temp }}/wishart-law-evidence/canonical/bounded.log
            ${{ runner.temp }}/wishart-law-evidence/source/bounded.log
          if-no-files-found: warn
          retention-days: 30
