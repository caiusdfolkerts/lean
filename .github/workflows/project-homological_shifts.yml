name: Lean homological_shifts

on:
  push:
    paths:
      - 'homological_shifts/**'
      - '!homological_shifts/**/*.md'
      - '!homological_shifts/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-homological_shifts.yml'
  pull_request:
    paths:
      - 'homological_shifts/**'
      - '!homological_shifts/**/*.md'
      - '!homological_shifts/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-homological_shifts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: homological_shifts
