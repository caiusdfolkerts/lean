name: Lean cubical_lower_bound

on:
  push:
    paths:
      - 'cubical_lower_bound/**'
      - '!cubical_lower_bound/**/*.md'
      - '!cubical_lower_bound/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-cubical_lower_bound.yml'
  pull_request:
    paths:
      - 'cubical_lower_bound/**'
      - '!cubical_lower_bound/**/*.md'
      - '!cubical_lower_bound/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-cubical_lower_bound.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: cubical_lower_bound
