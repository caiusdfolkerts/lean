name: Lean deformed_coinvariants

on:
  push:
    paths:
      - 'deformed_coinvariants/**'
      - '!deformed_coinvariants/**/*.md'
      - '!deformed_coinvariants/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-deformed_coinvariants.yml'
  pull_request:
    paths:
      - 'deformed_coinvariants/**'
      - '!deformed_coinvariants/**/*.md'
      - '!deformed_coinvariants/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-deformed_coinvariants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: deformed_coinvariants
