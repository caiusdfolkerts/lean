name: Lean higher_specht_bases

on:
  push:
    paths:
      - 'higher_specht_bases/**'
      - '!higher_specht_bases/**/*.md'
      - '!higher_specht_bases/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-higher_specht_bases.yml'
  pull_request:
    paths:
      - 'higher_specht_bases/**'
      - '!higher_specht_bases/**/*.md'
      - '!higher_specht_bases/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-higher_specht_bases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: higher_specht_bases
