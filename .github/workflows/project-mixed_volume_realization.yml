name: Lean mixed_volume_realization

on:
  push:
    paths:
      - 'mixed_volume_realization/**'
      - '!mixed_volume_realization/**/*.md'
      - '!mixed_volume_realization/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-mixed_volume_realization.yml'
  pull_request:
    paths:
      - 'mixed_volume_realization/**'
      - '!mixed_volume_realization/**/*.md'
      - '!mixed_volume_realization/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-mixed_volume_realization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: mixed_volume_realization
