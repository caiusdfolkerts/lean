name: Lean symmetric_rank_conditions

on:
  push:
    paths:
      - 'symmetric_rank_conditions/**'
      - '!symmetric_rank_conditions/**/*.md'
      - '!symmetric_rank_conditions/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-symmetric_rank_conditions.yml'
  pull_request:
    paths:
      - 'symmetric_rank_conditions/**'
      - '!symmetric_rank_conditions/**/*.md'
      - '!symmetric_rank_conditions/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-symmetric_rank_conditions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: symmetric_rank_conditions
