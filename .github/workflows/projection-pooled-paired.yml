name: Small nonrational pooled projection pairs
on:
  push:
    branches: [palomar/diagnostic-projection-pooled-pairs]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        batch: [B000, B012, B078]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PROJECTION_BATCH: Batches.${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/projection-speed-elan"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 --output "$RUNNER_TEMP/projection-speed-elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/projection-speed-elan.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/projection-speed-elan.tar.gz" -C "$RUNNER_TEMP/projection-speed-elan"
          "$RUNNER_TEMP/projection-speed-elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch cache of direct Mathlib imports
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          set -euo pipefail
          read -r -a modules <<< "$(python3 run_paired.py --external --batch "$PROJECTION_BATCH")"
          lake exe cache get "${modules[@]}"
      - name: Compare paired pooled builds and replay exports
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        timeout-minutes: 70
        run: lake env python3 run_paired.py --run --batch "$PROJECTION_BATCH"
      - name: Preserve bounded comparison receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: projection-pooled-${{ matrix.batch }}-${{ github.sha }}
          path: results/${{ env.PROJECTION_BATCH }}/
          if-no-files-found: error
          retention-days: 5
