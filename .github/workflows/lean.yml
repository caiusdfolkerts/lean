name: All projects verified

on:
  workflow_run:
    workflows:
      - Lean alternating_forms
      - Lean barycentric_invariance
      - Lean bier
      - Lean clique_covered_rigidity
      - Lean cold_spots
      - Lean conditional_decomposability
      - Lean cubical_indecomposability
      - Lean cubical_lower_bound
      - Lean deformed_coinvariants
      - Lean ellipsoid_intrinsic_volumes
      - Lean graphical_zonotopes
      - Lean higher_specht_bases
      - Lean homological_shifts
      - Lean mixed_volume_realization
      - Lean normal_projective
      - Lean polymatroidal_ideals
      - Lean projection_areas
      - Lean rank_three_projection_volumes
      - Lean singular_vector_spans
      - Lean small_nonrational
      - Lean sublattice_resolutions
      - Lean symmetric_rank_conditions
      - Lean three_sunlet_models
      - Lean toric_power_maps
      - Lean toric_quadratic_generation
      - Lean two_fermion_coinvariants
      - Lean unimodular
      - Lean volume_polynomials
      - Lean wishart
    types: [requested, in_progress, completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.pdf'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: aggregate-lean-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: .github
      - name: Test status aggregation
        run: python3 .github/scripts/test_ci.py
      - name: Check every project's latest build against its current inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/aggregate_status.py
