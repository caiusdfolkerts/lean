name: Lean barycentric_invariance

on:
  push:
    paths:
      - 'barycentric_invariance/**'
      - '!barycentric_invariance/**/*.md'
      - '!barycentric_invariance/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-barycentric_invariance.yml'
  pull_request:
    paths:
      - 'barycentric_invariance/**'
      - '!barycentric_invariance/**/*.md'
      - '!barycentric_invariance/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-barycentric_invariance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: barycentric_invariance
