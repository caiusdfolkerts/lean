name: Small nonrational block 0528 diagnostic

on:
  push:
    branches: [palomar/diagnostic-small-nonrational-block0528, palomar/diagnostic-small-nonrational-block0528-paired]
  workflow_dispatch:
    inputs:
      variants:
        description: Proofs to measure
        type: choice
        default: both
        options: [both, replacement]

permissions:
  contents: read

jobs:
  check:
    name: Check and measure ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((github.ref == 'refs/heads/palomar/diagnostic-small-nonrational-block0528-paired' || (github.event_name == 'workflow_dispatch' && inputs.variants == 'both')) && '["replacement","original"]' || '["replacement"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/block0528-elan"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 --output "$RUNNER_TEMP/block0528-elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/block0528-elan.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/block0528-elan.tar.gz" -C "$RUNNER_TEMP/block0528-elan"
          "$RUNNER_TEMP/block0528-elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact source, build, export and replay
        run: python3 diagnostic/run.py ${{ matrix.variant }} --run
      - name: Save bounded measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: block0528-${{ matrix.variant }}-${{ github.sha }}
          path: diagnostic-results/${{ matrix.variant }}.json
          if-no-files-found: warn
          retention-days: 5
