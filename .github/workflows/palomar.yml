name: Palomar full preflight
on:
  push:
    branches: ["palomar/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: "7a7f165337d6"
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path": "unimodular", "comparator_config_path": "unimodular/comparator.json", "authorization_relationship": "I am a responsible author or maintainer"}'
