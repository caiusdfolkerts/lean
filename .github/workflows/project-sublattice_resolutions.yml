name: Lean sublattice_resolutions

on:
  push:
    paths:
      - 'sublattice_resolutions/**'
      - '!sublattice_resolutions/**/*.md'
      - '!sublattice_resolutions/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-sublattice_resolutions.yml'
  pull_request:
    paths:
      - 'sublattice_resolutions/**'
      - '!sublattice_resolutions/**/*.md'
      - '!sublattice_resolutions/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-sublattice_resolutions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: sublattice_resolutions
