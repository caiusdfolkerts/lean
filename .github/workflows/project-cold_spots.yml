name: Lean cold_spots

on:
  push:
    paths:
      - 'cold_spots/**'
      - '!cold_spots/**/*.md'
      - '!cold_spots/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-cold_spots.yml'
  pull_request:
    paths:
      - 'cold_spots/**'
      - '!cold_spots/**/*.md'
      - '!cold_spots/**/*.pdf'
      - '.github/workflows/build-project.yml'
      - '.github/workflows/project-cold_spots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-project.yml
    with:
      project: cold_spots
