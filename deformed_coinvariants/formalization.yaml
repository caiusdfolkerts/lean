version: v0.4
project:
  name: The Hivert–Thiéry conjecture and differential normal forms
  description: The original differential power-operator joint-image quotient has the
    exact Hivert--Thiery Artin basis and graded symmetric-group comparison off its
    sharp exceptional set. The complete weighted-tail theorem covers both operator
    orders and every coefficient-fixing subgroup over arbitrary fields under full
    nonresonance. The Section6 statements give weighted Jacobian equality, isolated-hypersurface
    resonant defects, freeness over the actual coefficient subalgebra with every homogeneous
    Milnor-basis lift, finite-group decompositions and actual homogeneous equivariant
    splittings, and the complete-intersection scalar and arbitrary preserving-linear-group
    defect formulas.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
