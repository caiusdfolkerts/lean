version: v0.4
project:
  name: Exact cold-spot minima and translation classes
  description: Exact Gaussian minimum values and complete coordinate equality loci for E6, E8, the dual
    E7 lattice, BW16, and D_n plus in every even dimension n at least eight. Counts of actual deep-hole
    translation classes are 2, 135, 36, 120, and choose(n,n/2) respectively, the last for even n greater
    than eight. Gaussian sums are infinite series over explicit lattice sets; quotient classes contain
    actual real deep holes. This supplements the distinct entry for universal cold spots, positive mixtures
    and radii.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
