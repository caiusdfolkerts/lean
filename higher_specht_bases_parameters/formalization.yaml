version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    The prescribed higher Specht cosets form a basis of the untruncated
    Griffin ring over its elementary parameters in characteristic zero,
    with the exact factorial rank. Over any commutative coefficient ring,
    the elementary-parameter algebra is finite free and flat. Algebraic
    independence and the rank formula hold over nontrivial coefficient rings.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
