fidelity:
  divergences: >-
    The independent graded component is the actual polynomial Koszul complex
    with the deletion differential and coefficient degree q-p, followed by
    its cycles and boundary quotient. A genuine existing graded derived-Tor
    isomorphism connects it to the original proof. Multiplication is the
    supplied polynomial on actual ideal coefficients. Module coefficient
    isomorphisms commute with that multiplication; natural derived tensor
    braiding identifies both actual canonical Tor conventions. Graded
    injectivity follows from original actual Rees boundary reflection and
    the actual homogeneous filling projector. No nonvanishing surrogate,
    normalization premise or assumed injection is introduced. All signed
    degrees, fields and the zero-row case remain quantified.
