version: v0.4
project:
  name: First strands and minimum-generator Tor injections
  description: >-
    For sublattice monomial ideals over any field, a nonzero positive
    homological strand of a power already occurs in a positive power at most
    the homological degree. Multiplication by the minimum row monomial is
    injective on the actual Tor groups of successive powers and on every
    signed homogeneous Koszul homology component, with its original degree
    shift. For every homogeneous deformation with the prescribed initial
    ideal and original first-power Betti equality, the same first-occurrence
    assertion holds, and multiplication by its specified corresponding
    homogeneous generator is injective without a monic normalization. Both
    actual Tor conventions are included through natural derived tensor braiding.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
