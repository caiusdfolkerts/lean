version: v0.4
project:
  name: Frobenius generators for smooth toric varieties
  description: >-
    On every nonempty smooth finite toric fan, an ordinary positive-power direct
    image of an arbitrary actual Cartier line bundle generates the literal
    bounded coherent derived category exactly when every actual rational linear
    subspace has nonzero total restricted Zariski sheaf cohomology. Under that
    criterion every sufficiently large positive integer exponent generates.
    The arithmetic consequences retain the full integral cokernel, exact
    determinant periods and explicit raw-coefficient bounds, and the exact
    stable one-exponent class set.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
classification:
  arxiv: [math.AG, math.CO]
  msc2020: [14M25, 14F08, 52B20]
sources:
  - title: The Hanlon–Hicks–Lazarev conjecture on smooth toric varieties
    authors: [Caius Folkerts]
    type: paper
    relationship: formalizes
    location: paper.pdf
    note: Full categorical Theorem1.1; arithmetic/class-set endpoints including Lemmas6.1/7.1, Proposition6.2 class-set conclusion and raw-coefficient part of Theorem7.2. The finite integer-pattern and effective categorical conclusions are not yet compared.
