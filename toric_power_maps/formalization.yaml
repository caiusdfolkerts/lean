fidelity:
  divergences: >-
    Actual canonical fan schemes, Cartier divisors, ordinary module-sheaf
    pushforwards, bounded derived coherent objects, thick generation and actual
    Zariski sheaf cohomology are used. All rational linear subspaces and all
    cohomological degrees are retained. Necessary proved typing and record-law
    propositions are explicit comparison targets. The Solution transports the
    genuine source main theorem through literal data and actual record
    conversions, not an assumed equivalence or abstract generation predicate.
    A complete canonical TauCeti dependency upgrade supplies its own exact
    Mathlib pin. Canonical declarations replace only redundant compiled copies;
    complete original sources remain archived under source/ with licenses/hashes.
limitations:
