version: v0.4
project:
  name: Multiplication on the weight-graded relative Koszul complexes
  description: For a finite simplicial poset and a downward closed subposet, the comparison between the
    barycentric and original relative Koszul chain groups preserves multiplication on the associated graded
    for the weight filtration. The two products restrict exterior multiplication with coefficients in
    the respective face-ring ideals. The formula holds in every pair of internal degrees, homological
    degrees and weights. This is the chain-level part of the multiplicative comparison in Theorem 1.2.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
