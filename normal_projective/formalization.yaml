version: v0.4
project:
  name: Normal-projective equivalence and the exact cube bound
  description: >-
    PN equivalence of realizations of a simple polytope is exactly membership
    in the same connected component of its labelled realization space modulo
    affine transformations. Local changes use d projective and d normal moves.
    Every simple convex three-polytope is PN-unique. For every d at least 2,
    the largest distance from a combinatorial d-cube to the geometric cube is
    exactly 2d-3, with separate sharp projective and normal counts. The cyclic
    family forces the lower bound for every target facet labelling. A separate
    counterexample records the correction required in an auxiliary polarity identity.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
