version: v0.4
project:
  name: Local ranks and exterior Hilbert functions of two-fermion coinvariants
  description: For separated paired two-fermion data over an algebraically closed field of characteristic
    zero, the dimension at each support point is a product of the ramification orders, cluster multiplicities
    and a power of two. The exterior Hilbert polynomial determines the dimension in each exterior degree.
    For a positive number of variables the global formulas give the corresponding dimensions in terms
    of the degrees of the input polynomials.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
