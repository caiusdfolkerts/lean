version: v0.4
project:
  name: "Ellipsoids are determined by their intrinsic volumes"
  description: >-
    Theorems 1.1, 1.2 and 2.1 and the measured coefficient bounds in Section 5.1. Equality of intrinsic volumes determines every full-dimensional ellipsoid up to Euclidean congruence, including repeated semiaxes. On bounded nondegenerate families the uniform semiaxis recovery exponent is 1/n and is sharp in every neighborhood of every interior sphere, also at fixed volume for n at least two. The extended coefficient transform has the full proper smooth embedding, principal-minor and local-inverse conclusions.
  authors:
    - Caius Folkerts
  responsible_maintainers:
    - Caius Folkerts
  license: Apache-2.0
