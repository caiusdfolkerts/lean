version: v0.4
project:
  name: Sublattice resolutions and Betti preservation in all powers
  description: >-
    Closed binomial edge ideals and their displayed initial monomial ideals
    have equal Betti numbers in every positive power, over every field, in all
    homological degrees and integer ordinary degrees. Finite sublattice ideals
    satisfy the full signed fine-degree multichain Betti formula, with actual
    polynomial quotients by sums of predecessor colons, and their actual Rees
    Koszul homology algebra is generated in degree one. The literal finite
    Rees kernel has the displayed monic Groebner presentation. For every
    homogeneous deformation with this initial ideal, the first-power criterion
    gives the symbolic and initial identities, Betti preservation in all powers
    in every respected additive grading refining ordinary degree, and generation
    of its actual Rees Koszul homology in auxiliary degree one. The complete
    Corollaries5.1 and5.2 use actual quotient Koszul homology by sums of
    predecessor-colon ideals, give the rational polynomial and every
    nonnegative integer forward difference, and preserve the actual categorical
    projective-dimension and Ext-depth monotonicities, including empty-family
    and zero-row cases and the exact general homogeneous deformation transfer.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
