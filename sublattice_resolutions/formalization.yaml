fidelity:
  divergences: >-
    Actual polynomial Koszul homology is used as the independent interface for
    the genuine derived Tor Betti groups. Solution explicitly transports grading,
    variable action, differentials, cycles and boundaries to the original actual
    derived Tor components. Negative fine degrees vanish through actual chain
    pieces; all fields, positive powers, homological degrees and signed degrees
    remain quantified. The graph uses the given closed labeling without a
    connectivity assumption. The Rees conclusion uses the actual homology algebra.
