version: v0.4
project:
  name: Unimodular configurations and complete fans
  description: For every finite positively spanning ray configuration, actual complete rational salient
    fans with precisely those rays correspond to nonnegative integer solutions of all allowed-block facet
    equations with generic-direction degree one. Every solution has zero-one coefficients. The generic
    degree is independent of direction on signed boundary cycles, and every pair of fans is connected
    by finitely many Graver-primitive integer replacements through fans using maximal cones from the two
    endpoints. This entry records the complete-fan part of the paper, Theorem1.1 / Theorem3.1 and its
    consequences.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
