scope:
  known_gaps:
  - The canonical chain-monomial associated grade of Theorem 1.1 is tracked in the associated-graded companion.
  - Theorem 1.2, including actual Tor, products, relative and equivariant statements, and the scalar and
    first-cohomology obstructions of Theorem 9.4 lie outside this entry.
  notes: The declaration map records the selected results, their source locations, and the scope of companion
    work.
  current_selection: Theorem 1.1 coherent integral construction with graded/filtered parameter-module
    equivalences, actual face evaluations and every relative restriction kernel; full coherent uniform
    factorial-unit criterion of Theorem 1.3; unrestricted negative Boolean-simplex obstruction.
