limitations:
- 'Six supplied constructors are fixed by complete independently literal specifications: cube vertices,
  face vertices, both graph adjacency relations, every nonempty order-complex chain, and every standard-basis
  realization face. All other fields of these records are propositions. Their support obligations are
  not advertised as independent research results.'
- The registry entry records the principal lower bounds, substantive corollaries, and sharpness statements;
  generic local-propagation and facet-determination lemmas remain proved dependencies rather than separately
  advertised conclusions.
