version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    The irreducible summand of each index has the ordinary Specht shape of its tableau,
    with an equivariant isomorphism to the Young symmetrizer left ideal.
    One family of independent homogeneous irreducible polynomial
    subrepresentations gives the harmonic decompositions simultaneously
    for all allowed shapes. The untruncated family is locally finite by
    degree. Harmonic membership is expressed by the coefficient formula
    for the ordinary apolar pairing.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
