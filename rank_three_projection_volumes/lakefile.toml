name = "rank_three_projection_volumes"
version = "0.1.0"
defaultTargets = ["proof", "verification"]
moreLeanArgs = ["-t0", "-j1", "-DElab.async=false", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "2cabef97b63d3275776b8b060d802de6a6fa1055"

[[lean_lib]]
name = "proof"
srcDir = "source"
roots = ["rank_three_projection", "development.combined", "development.analytic_rigidity", "development.alexandrov_fenchel", "development.compactification", "volume_polynomials.mixed_volume_basis_part01", "volume_polynomials.mixed_volume_basis_part02", "development.finite_obstruction"]
allowImportAll = true

[[lean_lib]]
name = "verification"
srcDir = "source"
roots = ["verification.check_1"]
allowImportAll = true

[[lean_lib]]
name = "Palomar"
srcDir = "source"
roots = ["Challenge", "Solution"]

# Exact pinned proof-only TauCeti closure; no upstream source edits.
[[lean_lib]]
name = "TauCetiProofSources"
srcDir = "source"
roots = ["TauCeti.Analysis.Convex.LogConcave", "TauCeti.Analysis.Convex.Measure", "TauCeti.Analysis.Convex.Prod", "TauCeti.Analysis.Convex.Separation", "TauCeti.Analysis.InnerProductSpace.LinearIsometry", "TauCeti.Analysis.InnerProductSpace.Projection.Basic", "TauCeti.Analysis.MeanInequalities", "TauCeti.Analysis.SpecialFunctions.Pow.Integral", "TauCeti.Analysis.SpecialFunctions.Pow.NNReal", "TauCeti.Analysis.SpecialFunctions.Pow.Real", "TauCeti.Data.List.PermanencesMinusVariations", "TauCeti.Data.Set.Lattice", "TauCeti.Geometry.RealAlgebraic.Semialgebraic.AlgebraicDependence", "TauCeti.Geometry.RealAlgebraic.Semialgebraic.Basic", "TauCeti.MeasureTheory.Constructions.HaarToSphere", "TauCeti.MeasureTheory.Function.Monotone", "TauCeti.MeasureTheory.Group.Measure", "TauCeti.MeasureTheory.Integral.Lebesgue.Subsequence", "TauCeti.MeasureTheory.Integral.PrekopaLeindler", "TauCeti.MeasureTheory.Measure.Lebesgue.BrunnMinkowski.Basic", "TauCeti.MeasureTheory.Measure.Lebesgue.BrunnMinkowski.Equality", "TauCeti.MeasureTheory.Measure.Lebesgue.BrunnMinkowski.Homothety", "TauCeti.MeasureTheory.Measure.Lebesgue.BrunnMinkowski.Quantile", "TauCeti.MeasureTheory.Measure.Lebesgue.BrunnMinkowski.Real", "TauCeti.MeasureTheory.Measure.Lebesgue.BrunnMinkowski.Section", "TauCeti.MeasureTheory.Measure.Lebesgue.EqHaar", "TauCeti.MeasureTheory.Measure.Lebesgue.OrthogonalSlices", "TauCeti.MeasureTheory.Measure.Mod0MeasureIso", "TauCeti.MeasureTheory.SetAlgebra", "TauCeti.Probability.Cdf", "TauCeti.Probability.ConditionalProbability", "TauCeti.Probability.Quantile"]
leanOptions = { weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = true, warningAsError = true }
