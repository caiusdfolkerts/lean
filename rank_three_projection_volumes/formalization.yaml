version: v0.4
project:
  name: "Rank-three obstructions to coordinate projection volumes"
  description: >-
    For every n at least five, every positive hollow symmetric rank-three matrix lies outside the closure of actual complementary coordinate projection-volume arrays. The entry includes its inertia, strict perturbation and unconditional open-family conclusions. For every 1 <= k < n it also records the exact mixed-volume compactification by finite marked segments and the affine-dimension bound, including replacement of every marked representation.
  authors:
    - Caius Folkerts
  responsible_maintainers:
    - Caius Folkerts
  license: Apache-2.0
classification:
  arxiv: [math.MG]
  msc2020: ["52A20", "52A38"]
sources:
  - title: "Rank-three obstructions to coordinate projection volumes"
    type: paper
    authors: [Caius Folkerts]
    relationship: formalizes
    location: paper.pdf
    notes: >-
      Included paper at the reviewed snapshot. This is a source-based account;
      the packaging does not assert novelty or independent human review.
  - title: Supporting polytope proofs adapted from openai/math
    type: other
    relationship: adapts
    url: https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a
    notes: >-
      Source headers identify supporting polytope geometry adapted from this
      Apache-2.0 snapshot. Original attribution and applicable licence notices
      are retained. This credit concerns supporting formal code, rather than
      a claim that the paper's principal results appeared in that source.
  - title: Mathlib and Tau Ceti supporting formal libraries
    type: other
    relationship: background
    notes: >-
      Mathlib and its exact canonical closure remain pinned in lake-manifest.json.
      The 32 proof-only Tau Ceti modules are copied byte-for-byte from
      TauCetiProject/TauCeti at 06d5bb4e3ebb737dc6538567f5c53bf8800b9362; source hashes,
      original copyright headers and the upstream Apache-2.0 licence are retained
      under licenses/vendor/tauceti. No Tau Ceti module is imported by Challenge.
      This local proof library replaces the external all-module default build;
      no mathematical source, statement, proof or kernel check is weakened.
automation:
  methods:
    - method: agent
      tool_setup: >-
        The included paper discloses assistance from GPT-6 Astra, GPT-5.6 Sol
        and Kimi K3 in developing its proofs. The supplied project snapshot
        contains the substantive Lean development; exact division of prior
        formalization work among systems is not reconstructed here.
    - method: agent
      tool_setup: >-
        Palomar Challenge/Solution packaging and source inspection prepared
        with OpenAI Codex; new wrappers and metadata require fresh verification.
review:
  status: unchecked
  notes: >-
    Source statements and paper were inspected during packaging. The exact Lean
    sources at commit 8fe9d11ad83882ef5c2411edc874725fa95ce26f passed the complete
    pinned mechanical preflight in run 44379977931, including Comparator, Lean,
    NanoDa and the additional accepted con-ron replay. This records mechanical
    evidence at that commit; no independent human review or Palomar registration
    is claimed. The preferred statement-size advisory remains nonblocking.
status:
  notes: >-
    Prepared from caiusdfolkerts/research at commit
    e0696fddcd3d10b5d6461e62e9b2f02c4195be37, project rank_three_projection_volumes.
    See the source README for the original theorem mapping.
fidelity:
  notes: >-
    Every original paper proof module, the Challenge and Comparator configuration
    are byte-identical to the preceding vendored-source snapshot. The exact
    recursive proof-only Tau Ceti closure and attribution are retained locally
    against unchanged Mathlib and Lean pins. Solution additionally repairs three
    malformed rfl proof applications and transports the complete perturbation
    function and hollow-positive/strict-inertia predicates through explicit
    equality and iff lemmas. These wrapper proof repairs preserve every theorem
    statement, hypothesis and literal mathematical value. The passing mechanical
    reference is commit 8fe9d11ad83882ef5c2411edc874725fa95ce26f.
