name = "two_fermion_coinvariants"
version = "0.1.0"
defaultTargets = ["proof", "verification"]
moreLeanArgs = ["-j1", "-DElab.async=false", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "428aa8288d061ec3ae75c1b85ac178e2cb9def23"

[[lean_lib]]
name = "proof"
srcDir = "source"
roots = ["two_fermion", "two_fermion.PalomarPart000", "two_fermion.PalomarPart001", "two_fermion.PalomarPart002", "two_fermion.PalomarPart003", "two_fermion.PalomarPart004", "two_fermion.PalomarPart005", "two_fermion.PalomarPart006", "two_fermion.PalomarPart007", "two_fermion.PalomarPart008", "two_fermion.PalomarPart009", "two_fermion.PalomarPart010", "two_fermion.PalomarPart011"]
allowImportAll = true

[[lean_lib]]
name = "verification"
srcDir = "source"
roots = ["verification.check_1"]
allowImportAll = true

[[lean_lib]]
name = "Palomar"
srcDir = "source"
roots = ["Challenge", "Solution"]
allowImportAll = true
