name = "barycentric_invariance_tor"
version = "0.1.0"
defaultTargets = ["proof", "verification"]
moreLeanArgs = ["-j1", "-DElab.async=false", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "proof"
srcDir = "source"
roots = ["theorem13", "theorem94", "theorem12", "theorem11", "theorem12.PalomarPart000", "theorem12.PalomarPart001", "theorem12.PalomarPart002", "theorem12.PalomarPart003", "theorem12.PalomarPart004", "theorem13.PalomarPart000", "theorem13.PalomarPart001", "theorem13.PalomarPart002", "theorem94.PalomarPart000", "theorem94.PalomarPart001", "theorem94.PalomarPart002", "theorem94.PalomarPart003"]
allowImportAll = true

[[lean_lib]]
name = "verification"
srcDir = "source"
roots = ["verification.check_1", "verification.check_2", "verification.check_3"]
allowImportAll = true

[[lean_lib]]
name = "Palomar"
srcDir = "source"
roots = ["Challenge", "Solution"]
allowImportAll = true
