version: v0.4
project:
  name: Representation classes in the relative Tor formula
  description: Over every field, including modular characteristic, the class of homogeneous relative Koszul
    homology in the Grothendieck group of finite-dimensional representations is the sum of the classes
    of the rank-selected reduced relative cohomology groups. Both actions are induced by order automorphisms
    preserving the downward closed subposet. The equivariant inclusion of homogeneous Koszul homology
    identifies the left side with the corresponding internal degree of derived Tor.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
