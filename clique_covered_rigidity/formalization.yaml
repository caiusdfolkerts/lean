fidelity:
  notes: >-
    The Challenge copies the actual real rigidity, Euclidean twist, compatibility,
    quotient, and partition-defect semantics; no surrogate rank definition or
    restricted graph class is substituted. Source provenance and retained
    third-party notices are in NOTICE and licenses/. The source snapshot is
    caiusdfolkerts/research at e0696fddcd3d10b5d6461e62e9b2f02c4195be37.

comparison_support:
  note: >-
    The five principal results are separate from seven supporting theorem
    targets. Six support actual proof-bearing data fields or quotient witnesses;
    the seventh is the closed Mathlib proposition RingHomCompTriple for three
    identity homomorphisms of the real field. Local instances reference this
    named theorem atomically in compatibilityOperator and pinRow. All carrier,
    coordinate, map and defect formulas remain explicit. Source supplies actual
    proofs for every supporting theorem; no data-valued comparison hole is used.
