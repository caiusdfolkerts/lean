version: v0.4
project:
  name: Six-connected K4-covered graphs are rigid in three dimensions
  description: >-
    Every finite six-connected graph whose edges lie in copies of K4 is
    generically infinitesimally rigid in R3. The same conclusion holds for
    arbitrary rigid-subgraph edge covers of order at least four and for
    six-connected spanning completions of ambient rigid clusters. A flexible
    five-connected example proves sharpness. The pair-pin theorem identifies
    the actual generic relative motion dimension with the maximum partition
    defect, and gives singleton optimality and independence of the literal
    constraint rows under the stated no-merged-bodies and simplicity hypotheses.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
sources:
  - type: article
    title: Six-connected K4-covered graphs are rigid in three dimensions
    authors: [Caius Folkerts]
    identifier: paper.pdf
    relationship: formalizes
    note: Theorem 1.1, Corollary 1.2, Theorem 5.1, and the sharpness assertion.
classification:
  arxiv: [math.CO]
  msc2020: [05C10, 52C25]
automation:
