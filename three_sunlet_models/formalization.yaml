version: v0.4
project:
  name: Dimension and identifiability of three-sunlet models
  description: >-
    Normalized Latin systems of every order m at least five have three-sunlet
    image dimension 5m-4 in every characteristic, including the original finite
    abelian-group coordinates. Two transitive derangement families give the
    stated dimension 3m+2c-2. Complex generic fibers have unique unordered toric
    decomposition, normalized degree twice the square of the loop abelianization
    order, and the character-wreath Galois group. The model is rational over Q.
    Prime nonassociative loops give precisely two normalized general preimages;
    cyclic models of every order at least six admit rational reconstruction from
    the literal 8m-12 retained coordinates. Orbit and inverse-stable partition
    identifications have the complete dimension classification, which yields
    the full binary level-one network formula including triangles and two leaves.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
sources:
  - type: article
    title: Dimension and identifiability of three-sunlet models
    authors: [Caius Folkerts]
    identifier: paper.pdf
    relationship: formalizes
    note: >-
      Theorems 1.1, 2.3, 4.2, 6.1 and 7.1; Corollaries 5.1, 7.4 and 8.1.
      The Galois-group equivalence is compared as a definition value of its
      exact displayed multiplicative-equivalence type.
