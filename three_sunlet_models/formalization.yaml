fidelity:
  notes: >-
    The dimension statements retain every characteristic, literal affine image
    closure and original group-coordinate map. Complex hypotheses occur only
    where the paper uses them. Rationality is over the original characteristic-zero
    field, so Q is included without algebraic closedness. The retained coordinate
    set, normalized generic fibers, character-wreath group, arbitrary automorphism
    subgroups, inverse-stable partitions and actual binary-cactus network
    definitions are retained. Supporting tangent, contact, differential and
    field-reconstruction lemmas remain in the proof closure but are not separate
    Comparator targets. Source snapshot: caiusdfolkerts/research at
    e0696fddcd3d10b5d6461e62e9b2f02c4195be37.
