version: v0.4
project:
  name: Monomial bases for two-fermion coinvariants
  description: Literal ordered monomial classes form bases of the paired and strict weighted
    two-fermion moment quotients over every commutative coefficient ring with the stated factorial
    and nonempty weight-subset units. The polynomial inputs retain arbitrary coupled lower terms
    satisfying the exact highest-weight hypotheses. The quotients have the printed finite free
    ranks, including over the zero ring. The complete original Theorems1.1 and1.2 also give
    their actual associated graded and exterior-Hilbert pieces, with the genuine paired homogenized
    finite-free flat family and its zero and one algebra fibers.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
