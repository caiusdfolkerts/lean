name = "stress_flex_formalization"
version = "0.1.0"
defaultTargets = ["proof", "verification"]
moreLeanArgs = ["-j1", "-t0", "-M16384", "-DElab.async=false", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "2cabef97b63d3275776b8b060d802de6a6fa1055"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "06d5bb4e3ebb737dc6538567f5c53bf8800b9362"

[[lean_lib]]
name = "proof"
srcDir = "source"
roots = ["stress_flex", "torus_period"]
allowImportAll = true

[[lean_lib]]
name = "verification"
srcDir = "source"
roots = ["verification.complete"]
allowImportAll = true
