    - method: agent
      tool_setup: >-
        The manuscript discloses GPT-6 Astra, GPT-5.6 Sol, and Kimi K3
        assistance in developing its proofs. Historical roles beyond that
        disclosure have not been independently reconstructed.
    - method: agent
      tool_setup: >-
        OpenAI Codex GPT-6.1 Sol prepared the Palomar statement and metadata,
        comparing the supplied manuscript, README table, and Lean declarations.
review:
  status: unchecked
  notes: >-
    Packaging has undergone source-level statement comparison only. No fresh
    Lean build, Comparator run, NanoDa check, or independent mathematical
    peer review is claimed in this metadata. Consult reports and CI for actual
    later validation. No weakening of the original selected statements is intended.
limitations:
  - Custom definitions retain exact source data semantics and original names; only proof-valued fields are Challenge holes. Fresh Comparator validation is required.
  - The registry entry records all principal example variants, both universal obstruction regimes, and the final construction family; the Schur-realization and padded-inverse-span lemmas remain proved dependencies rather than separate registry conclusions.
fidelity:
  divergences: >-
    The explicit-example endpoints are existential wrappers with exactly the
    original finite ground-set types and every quantitative and qualitative
    property retained. Their Solution proofs instantiate the actual named
    manuscript constructions. This avoids inlining the large construction
    constants in the human-auditable Challenge while preserving the results.
