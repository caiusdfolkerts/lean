version: v0.4
project:
  name: The first explicit nonpolytopal Bier spheres
  description: >-
    Explicit finite complexes have nonpolytopal Bier spheres: the principal
    input has dimension 9 and yields a sphere of dimension 145181 with 290365
    actual vertices. The all-label, self-dual centrally symmetric, and input-
    dimension-three variants retain the manuscript's exact quantitative data.
    A universal sign-rank obstruction bounds strict sign matrices encoded by
    faces when the ghost Bier sphere is polytopal, with bounds m^2-m+1 for
    fixed positive face cardinality and m^2-m+2 for arbitrary cardinalities.
    The full binomial-inequality family, Bier's genuine PL-sphere theorem,
    Forster's inequality, Hadamard restrictions, and all-sign matrix rank are included.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
classification:
  arxiv: [math.CO, math.MG]
  msc2020: [52B05, 52B11]
