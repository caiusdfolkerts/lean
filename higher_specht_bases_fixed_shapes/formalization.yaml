version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    Each fixed span is equivariantly isomorphic to the ordinary Specht module
    of the indicated shape, defined by the signed polytabloid span.
    The span of the higher Specht classes with a fixed eligible left
    tableau is an irreducible subrepresentation for the permutation
    action on the Springer or Griffin quotient in the stated fields.
    For Griffin rings the multiplier is also fixed.
