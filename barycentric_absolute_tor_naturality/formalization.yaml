version: v0.4
project:
  name: Order automorphisms on ordinary Tor and its internal degrees
  description: For a finite simplicial poset, the canonical identification of Tor relative to the empty
    subposet with ordinary Tor intertwines the actions induced by every order automorphism. This holds
    both on the full Tor group and on each internal degree in Theorem 1.2.
  authors:
  - Caius Folkerts
  responsible_maintainers:
