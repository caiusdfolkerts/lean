version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: The specified unnormalized higher Specht polynomials form bases of
    every Springer ring and every Griffin ring over characteristic-zero fields, with
    the full partition and exponent-bound ranges. The literal Springer family is a
    basis over a field exactly in characteristic zero or characteristic greater than
    the diagram size. The Griffin family has the exact analogous characteristic range
    greater than n, including the empty partition under the stated positive exponent
    bound. The statement defines tableaux, cocharge, terminating cyclic insertion,
    eligibility, symmetrizers and the actual quotient ideals explicitly. Corollary4.3
    retains the prescribed Griffin basis for every dominance-triangular symmetric
    multiplier with arbitrary nonzero leading coefficient, requiring triangularity
    only at actually admissible indices.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
