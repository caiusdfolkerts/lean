version: v0.4
project:
  name: Local decomposition and ranks of two-fermion coinvariants
  description: Over an algebraically closed field of characteristic zero, the separated two-fermion quotient
    is the finite product of its nonzero local algebras at the support points. The dimension of each local
    algebra is a product of a power of two, the ramification orders and rising factorials in the cluster
    multiplicities. The local and global Hilbert formulas give the dimensions in each exterior degree.
    The global dimension formulas assume a positive number of variables.
  authors:
