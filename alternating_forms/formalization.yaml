version: v0.4
project:
  name: Hilbert series of exterior algebras modulo two quadrics
  description: The genuine exterior-algebra quotient by a general pair of two-forms has the
    full strip-walk Hilbert series, its exact binomial determinant coefficients, and literal
    vanishing above ceiling(n/2). The canonical odd pencil has the specified exterior-monomial
    basis in every degree. Over the complex numbers, each top bidegree component has the actual
    SL2 representation Sym^(2p+1)(Sym^q U) and dimension binomial(2p+q+1,q), for every p,q including
    zero.
  authors:
  - Caius Folkerts
