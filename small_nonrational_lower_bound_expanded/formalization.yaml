version: v0.4
project:
  name: Rational realizations of small four-polytopes
  description: >-
    Every four-polytope with at most ten vertices admits a rational realization
    of its face lattice. Every eleven-vertex four-polytope with a simple vertex
    also admits a rational realization. The least number of vertices of a
    nonrational four-polytope is attained and lies between eleven and seventeen.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
sources:
  - title: Small nonrational four-polytopes
    authors: [Caius Folkerts]
    type: paper
    id: "Caius Folkerts, Small nonrational four-polytopes (2026), corrected manuscript included as paper.pdf"
    location: Theorem 2, Corollary 4 and the vertex bounds in the introduction
    relationship: formalizes
    author_endorsement: participated
related_formalizations:
  - id: https://github.com/caiusdfolkerts/research/tree/a39e089d37e218063266ecf9b612552741b1ddab/small_nonrational
    relationship: builds-on
    note: The proof is repackaged from the author's geometric reductions and complete finite coverage.
classification:
  arxiv: [math.CO, math.MG]
  msc2020: [52B11, 52B05]
status:
  scope: >-
    Theorem 2, Corollary 4, and both inequalities and attainment
    in the stated bounds on the least number of vertices.
automation:
  methods:
