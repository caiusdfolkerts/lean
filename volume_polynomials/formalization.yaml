version: v0.4
project:
  name: "Volume polynomials and the Heine\u2013Shephard problem"
  description: >-
    The principal results of the included paper characterize volume-polynomial realizability. In dimension d at least three the n-body coefficient locus is semialgebraic exactly for n at most two; the entry includes the polytope clause, forced nonsemialgebraic shapes, and the countable rational quadratic characterization with strict separation, finite certificates, rejection termination and rational polytope reconstruction.
  authors:
    - Caius Folkerts
  responsible_maintainers:
    - Caius Folkerts
  license: Apache-2.0
classification:
  arxiv: [math.MG]
  msc2020: ["52A38", "14P10"]
sources:
  - title: "Volume polynomials and the Heine\u2013Shephard problem"
    type: paper
    authors: [Caius Folkerts]
    relationship: formalizes
    location: paper.pdf
    notes: >-
      Included paper at the reviewed snapshot. This is a source-based account;
      the packaging does not assert novelty or independent human review.
  - title: Supporting polytope proofs adapted from openai/math
    type: other
    relationship: adapts
    url: https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a
    notes: >-
      Source headers identify supporting polytope geometry adapted from this
      Apache-2.0 snapshot. Original attribution and applicable licence notices
      are retained. This credit concerns supporting formal code, rather than
      a claim that the paper's principal results appeared in that source.
  - title: Mathlib and Tau Ceti supporting formal libraries
    type: other
    relationship: background
    notes: >-
      Canonical dependency revisions are pinned in lake-manifest.json.
      Vendored supporting modules retain their source copyright headers and
      licences. These libraries supply background formal mathematics.
automation:
  methods:
    - method: agent
      tool_setup: >-
        The included paper discloses assistance from GPT-6 Astra, GPT-5.6 Sol
        and Kimi K3 in developing its proofs. The supplied project snapshot
        contains the substantive Lean development; exact division of prior
        formalization work among systems is not reconstructed here.
    - method: agent
      tool_setup: >-
        Palomar Challenge/Solution packaging and source inspection prepared
        with OpenAI Codex; new wrappers and metadata require fresh verification.
review:
  status: unchecked
  notes: >-
    Source statements and paper were inspected during packaging. No independent
    human review, new complete build, Comparator success, NanoDa success or
    Palomar registration is claimed by this metadata.
status:
  notes: >-
    Prepared from caiusdfolkerts/research at commit
    e0696fddcd3d10b5d6461e62e9b2f02c4195be37, project volume_polynomials.
    See the source README for the original theorem mapping.
fidelity:
  notes: >-
    All geometric notions and the forced infinite segment sum are explicit in
    Challenge. Three algorithm values are supplied by Solution through the
    Comparator definition_names mechanism and constrained by the all-input
    characterization, certificate and reconstruction statements. All 415
    mathematical assembly blocks are retained in ten modules. Two blocks use
    named genuine Fin bounds or the canonical Nat eliminator; original and
    prepared hashes are retained. Independent normalized real geometry is
    literal in both Challenge and Solution. Explicit scalar identities,
    coefficient maps, range equality and predicate/angle bridges transport
    the complete shape theorem to the original source geometry. The exact
    817-line Challenge and a separate genuine 521-line canonical-only bridge
    probe both elaborated successfully in diagnostic run 44368529809; this
    does not certify the complete source build, imported Solution, Comparator
    or independent kernel replays, which remain pending for this snapshot.
    The source map records provenance. The former
    monolithic stage2 ownership audit is preserved as readable text, while
    the active private-declaration audit inventories every split module.
limitations:
  notes: >-
    The Challenge records the semantic correctness and convergence properties
    of the source rational procedures. Supplied function values are not by
    themselves a machine-level computability assertion. The source includes
    concrete executable implementations and finite code-generation smoke
    checks, but no separate universally quantified Partrec/Computable bridge
    for the principal enumerator and reconstruction functions is claimed here.
