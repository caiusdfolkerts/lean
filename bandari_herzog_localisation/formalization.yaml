version: v0.4
project:
  name: The Bandari–Herzog localisation conjecture
  description: A nonzero monomial ideal is polymatroidal exactly when all its monomial
    localisations have linear resolutions, including at the graded maximal ideal.
    Local equigeneration suffices for ideals of intersection type. The minimum local
    generator degree is supermodular under local equigeneration, and the final criterion
    characterises polymatroidality by local equigeneration and the degrees of quotient
    socles.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
