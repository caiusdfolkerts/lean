name = "cubical_indecomposability"
version = "1.0.0"
defaultTargets = ["proof", "verification"]
enableArtifactCache = false
moreLeanArgs = ["-j1", "-t0", "-M16384", "-s65536", "-DElab.async=false", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "proof"
srcDir = "source"
roots = ["foundation_bundle", "incidence_bundle", "verification_bundle", "block_verification_bundle", "cubical_indecomposability"]
allowImportAll = true

[[lean_lib]]
name = "verification"
srcDir = "source"
roots = ["verification.complete"]
allowImportAll = true
