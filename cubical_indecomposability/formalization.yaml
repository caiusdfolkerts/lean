  notes: >-
    Packaging has undergone source-level statement comparison only. No fresh
    Lean build, Comparator run, NanoDa check, or independent mathematical
    peer review is claimed in this metadata. Consult reports and CI for actual
    later validation. No weakening of the original selected statements is intended.
limitations:
  - Challenge data definitions duplicate exact source semantics; only proof-valued construction fields are deliberate holes. Fresh Comparator validation is required.
  - Theorem 1 includes the exact f-vector, all parallel redrawings, and arbitrary convex summands for one and the same existential polytope. The equivalent named coordinate-witness specializations are not separate selected claims.
