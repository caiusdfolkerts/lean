version: v0.4
project:
  name: A counterexample to Smilansky's conjecture
  description: >-
    An actual rational full-dimensional convex four-polytope is cubical and
    Minkowski indecomposable, with face vector (144,404,390,130). All parallel
    redrawings of its actual edge graph are uniform scalings plus translations.
    Every arbitrary convex Minkowski summand is a translated nonnegative
    multiple of the polytope, with complementary scale for its complement.
    The formalization also records the one-dimensional quotient-space
    summand criterion, local four-cycle and two-neighbor rigidity lemmas,
    and the complete geometric and deformation-space auxiliary 32-vertex block.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
classification:
  arxiv: [math.CO, math.MG]
  msc2020: [52B05, 52B11]
