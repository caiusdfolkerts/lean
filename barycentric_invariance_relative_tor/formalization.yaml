version: v0.4
project:
  name: Barycentric invariance of relative Tor
  description: For a finite simplicial poset and a downward subposet, the associated
    graded of the degree-j piece of the i-th relative parameter Tor module is linearly
    equivalent to the direct sum of reduced relative cohomology over the rank sets
    of total degree j. A rank set S contributes in cohomological degree |S| − i −
    1. The coefficient ring may be any commutative ring.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
