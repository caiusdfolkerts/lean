version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    For each grade and each permutation, the actual quotient action has
    the sum of the characters of the ordinary Specht modules indexed by
    the eligible left tableaux and their multipliers. This is the
    character-valued form of the graded Frobenius formulas.
  authors:
  - Caius Folkerts
  responsible_maintainers:
