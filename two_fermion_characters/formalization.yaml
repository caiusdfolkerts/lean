version: v0.4
project:
  name: Initial coefficients and graded characters of two-fermion coinvariants
  description: For the type A quotient over a characteristic-zero field, the coefficient ideals describe
    the initial ideal, and the admissible boxes give their Hilbert functions. At diagonal elements of
    GL₂, the character in each polynomial degree is a sum over these boxes. On the full quotient the trace
    is the bivariate Eulerian polynomial evaluated at one plus each diagonal entry.
  authors:
  - Caius Folkerts
  responsible_maintainers:
