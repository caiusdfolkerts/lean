version: v0.4
project:
  name: Exact minor class and networks of deeply monotone polytopes
  description: >-
    The actual represented matroid of the original primitive geometric facet
    normals of a deeply monotone smooth reflexive polytope is in the ordinary
    constructive series-parallel class. Every ordinary matroid minor remains
    in the class, retaining the original integral dual labels. The matroid is
    the finite direct sum of its actual connected loopless component restrictions;
    each component has a genuine eligible rooted-network cycle-matroid model.
    Conversely every ordinary ground-series-parallel matroid embeds, on its
    full actual ground, as a minor of the primitive-normal matroid of a
    positive-dimensional deeply monotone coordinate polytope.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
