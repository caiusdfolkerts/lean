version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    The prescribed higher Specht cosets form bases in quotients by finite
    expressions of sums and intersections of Griffin ideals, with or without
    truncation, and in quotients by finite nonempty intersections of Springer
    ideals. Sums use intersections of eligible tableau-index sets. Ideal
    intersections use unions of those sets. The generated ideal lattices
    are distributive.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
