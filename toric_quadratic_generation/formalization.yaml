version: v0.4
project:
  name: Quadratic generation for smooth polytopes with long edges
  description: >-
    A smooth full-dimensional lattice polytope of positive dimension n whose
    edges have lattice length at least n has the integer decomposition property,
    and over every field its homogeneous toric ideal is generated by equal-sum
    quadratic binomials. For smooth polytopes with the same normal fan, edge
    bound n gives prescribed-parity decompositions of interior lattice points
    of their Minkowski sum. Edge bound n+1 gives the adjoint Minkowski equality.
    The latter two are the polytope formulations of Theorems 1.2 and 1.3.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
classification:
  arxiv: [math.AG, math.CO]
  msc2020: [14M25, 52B20, 13P10]
sources:
  - title: Quadratic generation for smooth polytopes with long edges
    authors: [Caius Folkerts]
    type: paper
    relationship: formalizes
    location: paper.pdf
    note: Theorems 1.1–1.3, pages 1–2; the mixed theorems are recorded in their polytope formulations.
