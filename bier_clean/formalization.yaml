fidelity:
  divergences: 'Six proof-bearing record constructors are supplied definitions with complete independently
    literal equations fixing every non-Prop record field: filtered extreme vertices, standard basis face
    images, exact nonempty input faces, complement duality, deleted-join Bier faces and the absent ghost
    label. Two exact source universe contexts are copied. The two named class-proof supports are retained.
    The new declaration order matches the measured Source helper names and avoids reusing an unrelated
    earlier generated proof; canonical rfl confirms the literal norm value is unchanged. All formalized
    hypotheses and conclusions are unchanged by this presentation correction. Relative to the manuscript,
    the general threshold is strengthened from m^2-m+3 to m^2-m+2, and the input-dimension-three construction
    uses all-column signs and2^73 anchors instead of balanced signs and binomial(75,37) anchors. These
    adaptations must not be read as the manuscript’s identical parameter range or quantitative example.
    The earlier exact snapshot passed full mechanical verification; this successor requires its own subsequent
    report.'
