version: v0.4
project:
  name: The first explicit nonpolytopal Bier spheres
  description: 'Explicit finite complexes have nonpolytopal Bier spheres. The principal input has dimension
    9 and yields a sphere of dimension 145181 with 290365 actual vertices; the all-label and self-dual
    centrally symmetric variants are also included. Two formalized adaptations differ from the cited manuscript:
    an all-column-sign construction gives an input-dimension-three example with sphere dimension 2^73+8
    and 2^74+19 actual vertices, and the general family works under binomial(m,k) >= m^2-m+2, strengthening
    the manuscript threshold m^2-m+3. A universal sign-rank obstruction gives bounds m^2-m+1 for fixed
    positive face cardinality and m^2-m+2 for arbitrary cardinalities. Bier’s PL-sphere theorem, Forster’s
    inequality, Hadamard restrictions, and all-sign matrix rank are included.'
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
