      in developing its proofs. Historical roles beyond that disclosure have not been
      independently reconstructed.
  - method: agent
    models:
    - GPT-6.1 Sol
    framework: OpenAI Codex
    tool_setup: Prepared independent literal mathematical statements, source proof
      bridges, module migrations, provenance and result mapping. Compared the manuscript,
      README and actual Lean declarations.
fidelity:
  divergences: Selected mathematical hypotheses and conclusions are retained. Fresh
    namespace names and source bridge proofs replace raw original declaration names.
    The path construction is an existential wrapper whose Solution supplies the original
    explicit polytope and complement; the recursive 3-tree predicate is related to
    the source by constructor induction.
