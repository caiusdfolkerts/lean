version: v0.4
project:
  name: 'Barycentric face rings: scalar and first-cohomology obstructions'
  description: The invariant scalar ideal of the actual module of coherent graded
    universal-parameter comparisons on a Boolean simplex is generated by (d-1)!. The
    cyclic submodule of genuine first group cohomology generated by the canonical
    comparison class is the coefficient ring modulo this factorial ideal. The same
    factorial annihilates the actual comparison obstruction on every finite simplicial
    poset of rank at most d and every order-automorphism action.
