version: v0.4
project:
  name: Characterizations of polymatroidal ideals
  description: >-
    A monomial ideal is polymatroidal exactly when every monomial localization
    has an actual linear free resolution. Universal pure reverse lexicographic
    colon quotients characterize the minimal generator antichain even without
    prior equigeneration. Ordinary ideal integral closedness together with local
    equigeneration gives another characterization. The real convex hull equals
    the full lower-rank polytope, and the actual ideal integral closure is the
    ideal of all its integer bases. A genuine finite linear presentation together
    with the prescribed distance-four exchange condition also characterizes
    polymatroidality. The selected consequences
    include genuine quotient-socle recognition, field independence, localization
    of universal quotients, every monomial term order, exact codimension
    bands and attained minimum testing-set sizes, exact necessary and sufficient
    variable-order coverage, sharp test-number formulas and bounds,
    fixed-degree logarithmic asymptotics, and sharp uniform rejection fractions
    with attained examples and independent repeated-test bounds.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
