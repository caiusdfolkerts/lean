version: v0.4
project:
  name: "Compatibility and realization of coordinate projection areas"
  description: >-
    The principal results and substantive corollaries of the included paper on coordinate projection areas: rank-three nonapproximation despite realizable four-coordinate restrictions, compatibility of boundary quartets, escape-cone and closure identities, strict realization by centrally symmetric polytopes with the actual vertex bound, weighted obstructions, open nonrealizable families, and the nonnegative rank-at-most-three classification.
  authors:
    - Caius Folkerts
  responsible_maintainers:
    - Caius Folkerts
  license: Apache-2.0
classification:
  arxiv: [math.MG]
  msc2020: ["52A20", "52A38"]
sources:
  - title: "Compatibility and realization of coordinate projection areas"
    type: paper
    authors: [Caius Folkerts]
    relationship: formalizes
    location: paper.pdf
    notes: >-
      Included paper at the reviewed snapshot. This is a source-based account;
      the packaging does not assert novelty or independent human review.
  - title: Supporting polytope proofs adapted from openai/math
    type: other
    relationship: adapts
    url: https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a
    notes: >-
      Source headers identify supporting polytope geometry adapted from this
      Apache-2.0 snapshot. Original attribution and applicable licence notices
      are retained. This credit concerns supporting formal code, rather than
      a claim that the paper's principal results appeared in that source.
  - title: Mathlib and Tau Ceti supporting formal libraries
    type: other
    relationship: background
    notes: >-
      Mathlib and its exact canonical closure remain pinned in lake-manifest.json.
      The 31 proof-only Tau Ceti modules are copied byte-for-byte from
      TauCetiProject/TauCeti at 06d5bb4e3ebb737dc6538567f5c53bf8800b9362; source hashes,
      original copyright headers and the upstream Apache-2.0 licence are retained
      under licenses/vendor/tauceti. No Tau Ceti module is imported by Challenge.
      This local proof library replaces the external all-module default build;
      no mathematical source, statement, proof or kernel check is weakened.
automation:
  methods:
    - method: agent
      tool_setup: >-
        The included paper discloses assistance from GPT-6 Astra, GPT-5.6 Sol
        and Kimi K3 in developing its proofs. The supplied project snapshot
        contains the substantive Lean development; exact division of prior
        formalization work among systems is not reconstructed here.
    - method: agent
      tool_setup: >-
        Palomar Challenge/Solution packaging and source inspection prepared
        with OpenAI Codex; new wrappers and metadata require fresh verification.
review:
  status: unchecked
  notes: >-
    The preceding full run 44392553582 compiled the complete Source and
    Solution, then rejected two NeZero support theorem signatures. The full
    read-only raw dependency audit 44462363796 visited 35,455 constants and
    found only those two type differences; all remaining data types, values
    and heights matched. Canonical probe 44465283393 elaborated the revised
    Challenge body and checked that all three complete support type ASTs
    exactly match the actual Source, without truncation. The revised complete
    Comparator and mandatory kernel checks remain pending. No independent
    human review or registry acceptance is claimed.
status:
  notes: >-
    Prepared from caiusdfolkerts/research at commit
    e0696fddcd3d10b5d6461e62e9b2f02c4195be37, project projection_areas.
    See the source README for the original theorem mapping.
fidelity:
  notes: >-
    The exact recursive proof-source Tau Ceti closure and attribution remain
    vendored against the unchanged Mathlib and Lean pins. After the failed
    full snapshot and measured raw/type diagnostics, three exact proposition
    witnesses for nonzero coordinate dimensions and the exponent two have
    genuine named proofs and are explicitly compared. Local instances use
    these witnesses in the affected literal projection, coordinate equivalence
    and boundary predicates. All mathematical expressions, carriers, measures,
    hypotheses and original paper proofs are retained. Only the two NeZero support signatures now explicitly name the exact Source
    zero dictionary, including its raw natural-number index. No source proof
    or mathematical formula changed in this follow-up. The revised complete
    Comparator and mandatory kernels remain pending.
