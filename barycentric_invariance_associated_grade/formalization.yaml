version: v0.4
project:
  name: The canonical associated graded comparison for barycentric subdivision
  description: For a finite simplicial poset of rank at most d over a commutative
    ring, the parameter-module comparison between the barycentric and original face
    rings preserves ordinary degree and the weight filtration. On every associated
    graded piece it induces the prescribed canonical comparison.
