name = "barycentric_invariance"
version = "0.1.0"
defaultTargets = ["proof", "Palomar"]
moreLeanArgs = ["-j1", "-DElab.async=false", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "proof"
srcDir = "source"
roots = ["theorem13", "theorem13.PalomarPart000", "theorem13.PalomarPart001", "theorem13.PalomarPart002"]
allowImportAll = true

[[lean_lib]]
name = "Palomar"
srcDir = "source"
roots = ["Challenge", "Solution"]
allowImportAll = true
