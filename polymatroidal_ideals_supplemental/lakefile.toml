name = "polymatroidal_ideals"
version = "0.1.0"
defaultTargets = ["proof", "verification"]
moreLeanArgs = ["-j1", "-DElab.async=false", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "proof"
srcDir = "source"
roots = ["characterizations.part001", "characterizations.part002", "characterizations.part003", "characterizations.part004", "characterizations"]
allowImportAll = true

[[lean_lib]]
name = "verification"
srcDir = "source"
roots = ["verification.check_1"]
allowImportAll = true

[[lean_lib]]
name = "submission"
srcDir = "source"
roots = ["Challenge", "Solution"]
allowImportAll = true

# Retained archival reading sources are registered but are not default build targets.
[[lean_lib]]
name = "reading_sources"
