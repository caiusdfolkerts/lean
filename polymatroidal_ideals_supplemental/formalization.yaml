version: v0.4
project:
  name: Prime-power intersections, regularity and sharp local obstructions for polymatroidal ideals
  description: >-
    Polymatroidality is equivalent to local equigeneration and an intersection
    presentation by ordinary coordinate-prime powers, with the exact lower-rank
    factorization of integral closure. For a nonzero equigenerated monomial ideal whose proper monomial localizations
    are polymatroidal, the actual integral closure is polymatroidal and its quotient
    by the ideal has finite length. The maximum hole degree determines actual
    Koszul regularity, and the least actual maximal-ideal power giving a
    polymatroidal ideal equals regularity minus generating degree. Deleting one
    Veronese generator has the complete stated fine and total nonlinear Betti
    strand. Exact pure and mixed isolators realize the smallest possible degrees
    and the sharp first nonlinear homological positions at every admissible
    localization, including necessity of the outer-band generation tests.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
