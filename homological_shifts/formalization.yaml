version: v0.4
project:
  name: Rank formulas for homological shifts of polymatroidal ideals
  description: Over every field, actual homological shifts of polymatroidal ideals
    obey the uniform power-stabilization equality, also with a fixed polymatroidal
    twist. An explicit partition minimum gives the exact integral polymatroid rank
    and its canonicality in every nonzero shift. The same partition data compute the
    genuine categorical projective dimension of every positive power and its eventual
    value. The independent statement uses actual augmented Koszul homology, identified
    with genuine derived Tor by the Solution.
