version: v0.4
project:
  name: Rank formulas for homological shifts of polymatroidal ideals
  description: Over every field, actual homological shifts of polymatroidal ideals satisfy uniform
    power and mixed-color stabilization, exact canonical rank formulas, and exact minimal Rees-generator
    intervals with signed rational thresholds. The actual total-support homogenized ideal has
    the stated genuine projective dimension, degree, canonical rank and all actual nonzero Tor
    generators, independently of the field. Ordinary and finite-color multi-Rees generation
    and monic integral closure retain arbitrary fixed twists and zero coordinates.
