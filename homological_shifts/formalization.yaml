version: v0.4
project:
  name: Rank formulas for homological shifts of polymatroidal ideals
  description: Over every field, actual augmented Koszul/derived-Tor homological shifts of polymatroidal
    ideals satisfy uniform power stabilization, also with a fixed polymatroidal twist. Exact
    partition rank/canonicality and genuine projective dimensions, ordinary-Rees generation
    and monic integral closure, complete Koszul field independence and universal squarefree-Veronese
    sharpness are selected. The latter includes every positive below-threshold zero and the
    exact nonzero threshold product ideal.
