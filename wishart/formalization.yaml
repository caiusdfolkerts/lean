version: v0.4
project:
  name: The Wishart product inequality and spectral correlation
  description: >-
    Genest, Ouimet and Richards formulated the Wishart product conjecture
    and proved a quantitative inequality for two principal minors. The
    paper proves the conjecture for any number of disjoint principal minors.
    Disjoint principal minors of every real-shape nonsingular Wishart law
    satisfy the product and selected-split moment inequalities for arbitrary
    nonnegative real powers, with finite moments and equality exactly for
    independent active covariance blocks. Proportional shifts and exponent
    monotonicity, overlapping real compression inequalities under their
    explicit rank conditions, inverse-Wishart association and exact moments,
    beta-II comparisons and moments, and complex and quaternion density and
    singular Gaussian Gram comparisons with finite powers are included.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
sources:
  - type: article
    title: The Wishart product inequality and spectral correlation
    authors: [Caius Folkerts]
    identifier: paper.pdf
    relationship: formalizes
    note: >-
      Theorem 1.1, proportional shifts and Proposition 4.1, Theorems 5.1-5.3,
      Corollary 5.4, Theorems 6.1 and 6.3, Corollary 6.2, and Theorem 7.1.
      Exact all-rank moment statements include zero-column compressions. The
      corrected archived manuscript ba59bf8832e2d13d233c440b9a1808a1cb979dbfec6f8ae473adaa8f068b3cf1
      explicitly sums only positive-rank compression exponents in Corollary 6.2.
      The exact baseline and pre-disclosure original, and the separate historical
      correction receipt, are distinguished in verification/paper-versions.json.
classification:
  arxiv: [math.PR]
  msc2020: [60E15, 62H10]
automation:
  methods:
    - method: agent
      tool_setup: OpenAI Codex with GPT-6.1 Sol, preparing Palomar packaging.
      notes: >-
        The archived baseline paper discloses GPT-6 Astra, GPT-5.6 Sol, and Kimi K3
        assistance in developing the proofs. Prior prompt history was not
        reconstructed. Packaging copies substantive proofs and extracts an
        independent custom-definition closure for all selected principal results.
        Packaging also names canonical proposition witnesses and uses genuine
        whole-value equalities and built-in definition equations for fidelity.
review:
  status: unchecked
  notes: >-
    The full workflow for each submitted commit records compilation of the
    proof, comparison against the independent statements, and independent
    kernel checks. Palomar records its editorial assessment separately.

fidelity:
  notes: >-
    No Gaussian-row restriction is imposed on the real shape in Theorem 1.1.
    All rank restrictions on real overlaps, actual almost surely constant
    beta-II factor removals, extended integrals, singular spectral boundary
    values, and positive-rank effective exponent sums are retained. The corrected archived manuscript is paper.pdf. The exact baseline with
    its AI disclosure and the pre-disclosure original are retained under
    verification/. The paper-version manifest distinguishes every actual
    input from the older historical correction receipt. Supporting radial identities and analytic lemmas remain
    in the full substantive source and are not separately selected targets.
    The Challenge imports canonical Mathlib only. It gives complete literal
    values for the real laws, Gaussian-Gram statistic and law, Frobenius matrix
    and symmetric-space structures, exact subtype uniformity, rectangular
    congruence and standard quaternion representation. Ten complete value
    equality specifications pin every supplied semantic primitive. Their
    actual source-equivalence proofs are required in the Solution; they do not
    replace any original paper result. The exact 215-module Tau Ceti source
    closure at 06d5bb4e3ebb737dc6538567f5c53bf8800b9362 is vendored only for
    the proof development. Every canonical source blob and its licence is
    retained unchanged and hashed. All original paper proof source files,
    including unused readable lower-case support copies, are retained.
    The unused lower-case support modules are outside the default build roots;
    every actual canonical import and new bridge module is explicitly registered.
    The Mathlib dependency closure and Lean toolchain pins are unchanged.
    Measured proof-reference normalization imports proved canonical witnesses
    into own paper modules; four finite-index proofs, two identity subtype
    proofs and spectral cardinality proof terms use named genuine lemmas.
    Original paper theorem proofs, hypotheses and functional input models
    are retained. Whole real and complex superclass record equalities and
    original-formula equalities provide explicit semantic preservation checks.
    Seventeen generated Lean equations and sixteen explicitly stated identities
    specify complete defining formulas. Lean checks the explicit identities
    by reflexivity against the definitions in the proof development.
    The product-Haar support instance now gives a proved local product
    translation-measurability record. All three component measures and the
    exact nested product formula are unchanged.
    Three coordinate-frame support proofs now use explicit scalar finite sums
    and the same compression equality. Their original signatures, mathematical
    operations and all principal results are unchanged.
    The complex multiple-row support proof now supplies its existing
    finite-product Borel witness explicitly and specifies the same carrier
    at the generic lemma application; no additional hypothesis is imposed.
    The existing singular Schur chart measurability proof now supplies proved
    component countability and product Borel instances. Its chart function,
    Haar/matrix-Gaussian noise law and all numerical input ranges are unchanged.
    Source snapshot is caiusdfolkerts/research at
    e0696fddcd3d10b5d6461e62e9b2f02c4195be37.

comparison_support:
  note: >-
    The original twenty principal/support targets are retained. Ten additional
    complete primitive value specifications, gauge record specifications,
    proved proposition witnesses, constructor support, and thirty-three defining
    equations support the comparison of those twenty results.
    The semantic definition targets have genuine literal values in Challenge
    and their entire records/functions are fixed by the compared equality
    specifications; they are not unconstrained function or geometry holes.
    Six proof-instance targets (two quaternion BorelSpace instances
    and four symmetric-space topology or uniformity instances) are fully specified
    propositions with genuine canonical witnesses in Challenge and actual source
    proofs in Solution. The symmetric-matrix continuous extended norm is a data-bearing record
    whose full defining equation is checked. All measures, normalizations,
    topologies, norms, matrix operations, parameter ranges and profiles retain
    explicit source values.
