definition_specifications:
  note: 'Comparator compares raw ConstantInfo, including proof fields and reducibility
    heights. The five recorded definition values therefore use its definition-hole
    interface. This does not leave their mathematics unspecified: compared normal
    and support projections fix relabelling and both cube families completely; a literal
    iff fixes geometric word length, and IsLeast uniquely fixes distance. All specifications
    are independent statements using only the ordinary literal definitions shown in
    Challenge.lean, and their Solution proofs use the actual original constructions.
    No numerical distance is manufactured by a definition.'
