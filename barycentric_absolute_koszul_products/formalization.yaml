version: v0.4
project:
  name: Multiplication in the associated graded of Koszul homology
  description: For a finite simplicial poset over a commutative ring, the comparison from the associated
    graded of the original Koszul homology to barycentric graded Koszul homology preserves the exterior
    product in every pair of homological degrees and filtration weights. The compared equations specify
    both standard bases on every monomial index. They identify the comparison on each chain grade with
    its canonical basis comparison, and its map on homology with the map induced by that chain comparison.
    This is the Koszul homology product comparison used for Theorem 1.2.
