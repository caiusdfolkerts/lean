review:
  status: unchecked
  notes: >-
    Packaging has undergone source-level statement comparison only. No fresh
    Lean build, Comparator run, NanoDa check, or independent mathematical
    peer review is claimed in this metadata. Consult reports and CI for actual
    later validation. No weakening of the original selected statements is intended.
limitations:
  - Challenge data definitions duplicate exact source semantics and original names; only proof-valued construction fields are holes. Fresh Comparator validation is required.
  - The registry entry records the principal lower bounds, substantive corollaries, and sharpness statements; the generic local-propagation and facet-determination lemmas remain substantive proved dependencies rather than separately advertised registry conclusions.
