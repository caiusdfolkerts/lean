version: v0.4
project:
  name: Face numbers of cubical polytopes
  description: >-
    Convex cubical polytopes in every dimension at least three satisfy the
    exact edge and higher-face lower bounds of the manuscript. In dimensions
    at least four, all bounds include the strengthening by the absolute
    imbalance of the two colour classes. The edge bound extends to every
    finite cubical PL sphere with the stated dimension and common-face
    hypotheses. Cubes and all finite realized facet-stacking sequences attain
    the bounds. The formal objects are actual convex hulls with exposed faces,
    actual cubical cell complexes, genuine piecewise affine sphere equivalences,
    and actual face-poset facet gluings.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
classification:
  arxiv: [math.CO, math.MG]
  msc2020: [52B05, 52B11]
sources:
  - title: Face numbers of cubical polytopes
    authors: [Caius Folkerts]
    type: paper
    relationship: formalizes
    location: paper.pdf
    note: Theorem 1, Corollaries 4 and 5, the strengthened face formulas, and cube/stacking sharpness.
related_formalizations:
