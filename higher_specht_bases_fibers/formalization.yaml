version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    Every elementary-parameter fiber has the prescribed product of tensor
    products of Springer rings after algebraic closure, with the canonical
    root multiplicities and the exact number of factors. The split-field
    statement includes repeated roots and arbitrary characteristic.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
classification:
  arxiv:
  - math.CO
  - math.RT
  msc2020:
  - 05E10
  - 20C30
sources:
- type: paper
  title: Higher Specht bases for Springer and Δ-Springer rings
  authors:
  - Caius Folkerts
  relationship: formalizes
  author_endorsement: participated
  url: https://github.com/caiusdfolkerts/research/blob/e0696fddcd3d10b5d6461e62e9b2f02c4195be37/higher_specht_bases/paper.pdf
  note: 'Exact included paper SHA-256: 931c0ee33b94c7a77d373c4040abb40151a8f1cd049b977006df188e31013a0c.
    Scope and declaration locations are recorded in map.json; novelty is not independently established.'
automation:
  methods:
  - method: agent
    tool_setup: OpenAI Codex
    notes: Codex extracted the fiber definitions independently and connected the existence
      statements to the retained explicit algebra equivalences.
  - method: other
    tool_setup: Historical AI assistance reported in the included paper
    notes: The paper credits GPT-6 Astra, GPT-5.6 Sol and Kimi K3 for assistance developing its proofs.
      The exact model roles and extent of historical Lean automation have not been reconstructed from
      the snapshot.
review:
  status: unchecked
  notes: This fiber selection requires its own full preflight.
scope:
  current_selection: Theorem 7.1 algebra equivalence in the split case and after algebraic closure, and precise multinomial factor count.
  known_gaps:
  - Component ideals, reducedness, the étale locus and subsequent geometry corollaries are outside this comparison.
  notes: The compared statements express the algebra equivalences as existence propositions. Solution uses the explicit equivalences without modifying their constructions.
