version: v0.4
project:
  name: The sharp vertex bound for conditional decomposability
  description: >-
    For every dimension d at least 3, the least number of vertices of a
    conditionally Minkowski decomposable convex d-polytope is 4d-4.
    The formalization proves the universal lower bound, all-dimensional
    attainment, the literal least-number formulation, and the stronger
    statement that below this threshold decomposability is determined by
    the face lattice. Polytopes are actual finite convex hulls with their
    extreme vertices, and Minkowski summands may have any affine dimension.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
classification:
  arxiv: [math.CO, math.MG]
  msc2020: [52B05, 52B11]
