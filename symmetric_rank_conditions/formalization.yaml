version: v0.4
project:
  name: Gröbner bases for symmetric rank conditions
  description: >-
    Every realizable symmetric northwest rank profile defines a prime ideal
    over every coefficient field, with the prescribed folded-antidiagonal
    initial ideal and the actual rank-locus vanishing ideal over algebraically
    closed fields. For every symmetric nonnegative rank array and finite valid
    list of symbolic powers of full symmetric determinantal ideals, the
    prescribed minors and exact-score minor products give a Gröbner basis.
    Its integral monic normalization yields a fixed standard-monomial basis
    after arbitrary commutative base change. Selected applications include
    domain and geometric-fiber consequences and arbitrary base change of finite
    compatible sums and intersections with free standard-monomial quotients.
    The actual single symbolic Rees algebra has the displayed finite SAGBI basis.
  authors: [Caius Folkerts]
  responsible_maintainers: [Caius Folkerts]
  license: Apache-2.0
