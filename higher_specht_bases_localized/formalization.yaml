version: v0.4
project:
  name: Higher Specht bases for Springer and Δ-Springer rings
  description: >
    The prescribed unnormalized higher Specht families form bases over the
    localization of the integers at the applicable factorial. The Springer
    statement applies to every diagram. The Griffin statement includes the
    empty partition under the stated positive exponent bound.
  authors:
  - Caius Folkerts
  responsible_maintainers:
