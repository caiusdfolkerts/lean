version: v0.4
project:
  name: 'Barycentric invariance: homogeneous Tor and rank-selected cohomology'
  description: For every field and finite simplicial poset of bounded rank, the associated
    graded of each actual homogeneous parameter Koszul homology group of its face
    ring is the direct sum of ordinary rank-selected reduced cohomology in the stated
    degrees. The filtration has the explicit finite bound 2*d*j+1. The actual total
    parameter complex is also compared with Mathlib derived Tor; the Solution uses
    the existing filtered identification of homogeneous Koszul homology with ordinary
    internal Tor. Equivariance, products, relative pairs and representation-group
    consequences are outside this selection.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
