version: v0.4
project:
  name: Barycentric invariance and universal parameters for face rings
  description: Actual face rings of every finite simplicial poset and its barycentric
    subdivision admit coherent integral comparisons that extend to every commutative
    coefficient ring, commute with the universal rank parameters, preserve ordinary
    grading and the rank-weight filtration, and identify every relative restriction
    kernel. Uniform coherent equivariant comparisons in rank at most d exist exactly
    when (d-1)! is a unit. On a Boolean simplex, a nonunit factorial excludes even
    an ungraded, incoherent symmetric-group equivariant parameter-module equivalence.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
