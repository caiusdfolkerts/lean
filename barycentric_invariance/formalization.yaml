scope:
  known_gaps:
  - The canonical chain-monomial associated-grade identification of Theorem 1.1 has
    not yet been independently extracted.
  - Actual-Tor, rank-selected cohomology, equivariance and product clauses of Theorem
    1.2, and scalar/H1 obstruction Theorem 9.4, belong to independently concatenated
    proof bundles and are being prepared as separate honest configurations. Importing
    all bundles into one Solution would redeclare shared core constants.
  - Three oversized proof bundles were split at original source-module boundaries
    with anonymous scopes/options restored and all shards added to explicit Lake roots;
    fresh full elaboration remains required.
  - Independent Challenge elaboration passed; Solution, Comparator and independent
    replay remain pending.
  notes: The submitted project contains the substantive historical proof development
    copied from the pinned source snapshot; this is not a thin wrapper. Historical
    upstream dependencies and license notices are retained. See map.json for exact
    proposed selections and unresolved source mapping.
  current_selection: Theorem 1.1 coherent integral construction with graded/filtered
    parameter-module equivalences, actual face evaluations and every relative restriction
    kernel; full coherent uniform factorial-unit criterion of Theorem 1.3; unrestricted
    negative Boolean-simplex obstruction.
