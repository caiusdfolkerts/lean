      bridges, module migrations, provenance and result mapping. Compared the manuscript,
      README and actual Lean declarations.
fidelity:
  divergences: Fresh literal semantics and explicit source bridges. Incidence tree/forest
    and exact dimension/spectrum formulas are included. Corollaries6.7/6.8 algorithmic
    implementation, support recovery and certified time-complexity clauses are not
    claimed.
review:
