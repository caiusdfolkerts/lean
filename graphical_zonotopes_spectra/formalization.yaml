version: v0.4
project:
  name: 'Sharp bounds for indecomposable graphical-zonotope summands: spectra'
  description: Support and separator constraints for indecomposable graphical-zonotope
    summands, planar classification, and exact dimension spectra for 3-trees and partial
    3-trees, with lattice attainment and intrinsic incidence forests. Includes tree-join
    and three-hub book dimension formulas, Hamiltonian 3-tree lattice witnesses, and
    K5-free graphs with full-dimensional indecomposable lattice weak summands but
    no admissible spanning 3-tree.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
