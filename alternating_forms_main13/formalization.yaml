version: v0.4
project:
  name: Graded coordinate degenerations and Koszulness for the canonical odd pencil
  description: In characteristic zero, every positive plane dimension in the canonical odd pencil has
    actual coordinate-graded flat Rees families to the specified Richardson ring, followed by the Hibi
    family, with algebra isomorphisms on all zero and nonzero fibers preserving every ordinary degree.
    Good Plücker coordinates have a finite quadratic Gröbner basis. The actual quotient rings are Koszul,
    using ordinary categorical Tor for one-plane rings and the explicit normalized bar cycle/boundary
    criterion for higher planes.
  authors:
  - Caius Folkerts
  responsible_maintainers:
