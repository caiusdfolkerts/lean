version: v0.4
project:
  name: "Undecidability of mixed-volume realization"
  description: >-
    Rational membership in the complete forty-four-body cubic coefficient locus is
    co-recursively enumerable complete even for nonnegative coefficients, with
    point-padding extensions. For rational automata with at least one alphabet
    letter, the uniform algorithm produces the complete cubic array and the quadratic
    section whose realizability is equivalent to the universal cutpoint condition.
    Corollary 5.1 fixes a rational quadratic family from the probability simplex in
    R28 to cubic coefficient arrays for 91 bodies. Even when a rational coefficient
    input is promised to lie in the real image of this fixed family, deciding its
    mixed-volume realizability is undecidable. This is a promise problem on that
    family, not unrestricted membership in its image. The explicit three-parameter,
    twelve-body section in Theorem 6.1 has infinitely many boundary planes and
    obstructs semialgebraicity.
  authors:
    - Caius Folkerts
  responsible_maintainers:
    - Caius Folkerts
  license: Apache-2.0
classification:
  arxiv: [math.MG]
  msc2020: ["52A38", "03D35"]
sources:
