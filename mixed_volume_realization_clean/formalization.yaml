review:
  status: unchecked
  notes: >-
    On 2026-11-19, full verification of commit ab3c7578c6078d7f173e20e3ba489dcbca6622be
    passed, including Source and Solution builds, Comparator and independent kernels.
    The editorial review then identified two presentation gaps, addressed here by
    stating the paper's positive-alphabet hypothesis and the fixed-section promise.
    This revision changes formalization.yaml only. Its verification and editorial
    outcomes are recorded separately; no clean editorial decision is claimed here.

status:
  notes: >-
    Prepared from caiusdfolkerts/research at commit
    e0696fddcd3d10b5d6461e62e9b2f02c4195be37, project mixed_volume_realization.
    See the source README for the original theorem mapping.
fidelity:
  notes: >-
    All geometry, stochastic automata and exact rational representations are
    explicit in Challenge. The uniform program and rational coefficient family
    are supplied by Solution through Comparator definition_names. The uniform
    theorem constrains output correctness and section equivalence for every positive
    alphabet size s, every state dimension m and valid rational input representation;
    the section equivalence uses a stochastic initial row and threshold in (0,1).
    The positive-alphabet hypothesis is the paper's standing assumption s >= 1
    at the start of Section 2. No zero-letter output-correctness claim is made.
    The exact recursive proof-source Tau Ceti closure and attribution remain
    vendored against the unchanged Mathlib and Lean pins. Following the failed
    full snapshot and measured raw/type diagnostics, literal evaluation now
    takes the complete rational family as an explicit argument, with actual
    source equality proofs in Solution. The measured characteristic-zero proof
    and exact label bounds have named genuine support statements. The ordered
    word product uses the same nil/cons recurrence through canonical List.rec;
    its original recurrence proofs are retained. These changes preserve every
    geometric, input, output and algorithm hypothesis. The earlier mechanical verification passed for the exact prior commit recorded
    above; all Lean declarations and Comparator selections are unchanged in this
    metadata revision.
