    type: paper
    authors: [Caius Folkerts]
    relationship: formalizes
    location: paper.pdf
    notes: >-
      Included paper at the reviewed snapshot. This is a source-based account;
      the packaging does not assert novelty or independent human review.
  - title: Supporting polytope proofs adapted from openai/math
    type: other
    relationship: adapts
    url: https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a
    notes: >-
      Source headers identify supporting polytope geometry adapted from this
      Apache-2.0 snapshot. Original attribution and applicable licence notices
      are retained. This credit concerns supporting formal code, rather than
      a claim that the paper's principal results appeared in that source.
  - title: Mathlib and Tau Ceti supporting formal libraries
    type: other
    relationship: background
    notes: >-
      Mathlib and its exact canonical closure remain pinned in lake-manifest.json.
      The 31 proof-only Tau Ceti modules are copied byte-for-byte from
      TauCetiProject/TauCeti at 06d5bb4e3ebb737dc6538567f5c53bf8800b9362; source hashes,
      original copyright headers and the upstream Apache-2.0 licence are retained
      under licenses/vendor/tauceti. No Tau Ceti module is imported by Challenge.
      This local proof library replaces the external all-module default build;
      no mathematical source, statement, proof or kernel check is weakened.
